{% extends "base.html" %}
{% load static %}

{% block title %}Manager Login - {{ profile.name }}{% endblock %}

{% block content %}
<section class="section" style="min-height: 70vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5" data-aos="fade-up">
                <h3 class="text-center mb-4">Manager Login</h3>

                {% if form.errors %}
                    <div class="alert alert-danger">Incorrect username or password.</div>
                {% endif %}

                <form method="post" action="{% url 'dashboard_login' %}" class="contact-form">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        {{ form.password }}
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-accent btn-lg w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
